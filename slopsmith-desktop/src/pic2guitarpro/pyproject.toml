[project]
name = "pic2guitarpro"
version = "0.1.0"
description = "Convert guitar tablature image collections into Guitar Pro (.gp5) scores."
requires-python = ">=3.12"
dependencies = [
    "pytesseract>=0.3.10",
    "pillow>=11.0",
    "anthropic>=0.50",
]

[project.scripts]
pic2guitarpro = "pic2guitarpro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pic2guitarpro"]
